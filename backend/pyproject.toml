[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-train-platform-api"
version = "0.1.0"
description = "Control plane API for the vision model training platform"
requires-python = ">=3.9"
dependencies = [
  "alembic==1.16.5",
  "argon2-cffi==25.1.0",
  "email-validator==2.3.0",
  "fastapi==0.116.1",
  "pydantic==2.10.6",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.10.1",
  "PyJWT==2.10.1",
  "python-multipart==0.0.20",
  "redis==6.4.0",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "pytest-cov==6.2.1",
  "ruff==0.12.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
